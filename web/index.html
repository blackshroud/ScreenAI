<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenCopilot</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/live-copilot.css"> <!-- New CSS for general copilot view -->
    <link rel="stylesheet" href="/static/css/markdown-styles.css">
    <link rel="stylesheet" href="/static/css/hotkeys.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>

<body>

    <!-- Main Copilot View -->
    <div id="copilot-view" class="view active">
        <div class="copilot-container">
            <!-- Header -->
            <div class="copilot-header">
                <div class="copilot-status">
                    <div class="status-indicator recording"></div>
                    <span>ScreenCopilot Session</span>
                </div>
                <div class="header-controls">
                    <select id="persona-select" aria-label="Select AI Persona">
                        <!-- Options will be dynamically loaded by JavaScript -->
                    </select>
                    <button id="mute-btn" class="mute-btn" title="Mute microphone input (Alt+M)">
                        <span class="mute-icon">🎤</span>
                        <span class="mute-text">Mute</span>
                    </button>
                    <button id="reset-session-btn" class="reset-btn" title="Reset session context (Alt+O)">Reset</button>
                    <button id="end-session-btn" class="end-btn" title="End session">End Session</button>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="copilot-content">
                <div class="conversation-stream" id="conversation-stream">
                    <!-- Dynamic content will be added here -->
                    <div class="initial-message">
                        <h1>Welcome to ScreenCopilot!</h1>
                        <p>Select a persona above to get started or just ask me anything.</p>
                        <p>Use global hotkeys for seamless interaction (e.g., Alt+S to screenshot).</p>
                    </div>
                </div>
            </div>

            <!-- User Input Area -->
            <div class="user-input-area">
                <textarea id="user-question-input" placeholder="Ask ScreenCopilot anything..." rows="1"></textarea>
                <button id="send-question-btn" title="Send your question">Send</button>
            </div>

            <!-- Current Activity Indicator -->
            <div class="activity-indicator" id="activity-indicator">
                <div class="listening-state">
                    <div class="pulse"></div>
                    <span>Listening...</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/main.js"></script>

</body>

</html>
